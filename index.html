<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Barbearia Dom Camargo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#07080a; --surface:#101216; --surface2:#1a1d23; --line:#2a2e36;
  --text:#f1f3f5; --muted:#9ba2ac; --accent:#d13b34; --accent-ink:#ffffff;
  --accent-text:#f2645d; --accent-text:color-mix(in srgb, var(--accent) 68%, white);
  --danger:#e5605f; --ok:#45b784; --warn:#e2a542;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font-display:'Bebas Neue',Impact,'Arial Narrow',sans-serif; --font-body:'Manrope',system-ui,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.05;margin:0 0 .45em;letter-spacing:.02em}
h1{font-size:clamp(2.8rem,9vw,4.6rem)} h2{font-size:clamp(2rem,5vw,2.8rem)} h3{font-size:1.55rem}
p{margin:0 0 1em} a{color:var(--accent-text);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.875rem} .right{text-align:right} .center{text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main{min-height:70vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.page{padding:26px 0 40px}
.page > .wrap > h1{font-size:clamp(2.2rem,5vw,3rem)}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,8,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--text)}
.brand:hover{text-decoration:none}
.brand-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.brand{letter-spacing:.03em;font-size:1.45rem}
.topnav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.topnav a,.topnav button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap}
.topnav a:hover,.topnav button:hover{color:var(--text);text-decoration:none;background:var(--surface)}
.topnav a.on{color:var(--accent-ink);background:var(--accent)}
.bottomnav{display:none}
@media (max-width:820px){
  .topnav{display:none}
  .topbar .wrap{height:56px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(16,18,22,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .bottomnav a,.bottomnav button{flex:1 0 64px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:.68rem;font-weight:600;padding:6px 4px;border-radius:12px;cursor:pointer;white-space:nowrap}
  .bottomnav a:hover{text-decoration:none}
  .bottomnav svg{width:22px;height:22px}
  .bottomnav a.on{color:var(--accent)}
}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);font-weight:700;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{text-decoration:none;border-color:var(--muted)} .btn:active{transform:scale(.98)}
.btn.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent} .btn.danger{color:var(--danger);border-color:rgba(229,96,95,.4);background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem} .btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap} .row > *{flex:1 1 160px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.tap{cursor:pointer;transition:border-color .15s,transform .12s;text-align:left;width:100%;color:inherit;font:inherit}
.card.tap:hover{border-color:var(--accent)} .card.tap.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid.stats{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat b{display:block;font-family:var(--font-display);font-size:2.6rem;line-height:1.05;font-weight:400}
.stat span{color:var(--muted);font-size:.86rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--surface2)}
.pill.scheduled{color:var(--warn);border-color:rgba(226,165,66,.4)} .pill.confirmed{color:var(--ok);border-color:rgba(69,183,132,.4)}
.pill.completed{color:var(--muted)} .pill.cancelled{color:var(--danger);border-color:rgba(229,96,95,.4)} .pill.no_show{color:var(--danger)}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:var(--accent);flex:none;overflow:hidden}
.avatar.lg{width:84px;height:84px;font-size:1.6rem}
.flex{display:flex;gap:12px;align-items:center} .flex.top{align-items:flex-start} .flex.between{justify-content:space-between} .flex.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack > * + *{margin-top:12px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-lg)}
.tabs{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}

/* hero — perfil no estilo do Instagram */
.hero{position:relative;overflow:hidden;padding:40px 0 30px;border-bottom:1px solid var(--line);text-align:center;
  background:
    linear-gradient(180deg,rgba(7,8,10,.55) 0%,rgba(7,8,10,.25) 38%,rgba(7,8,10,.7) 78%,var(--bg) 100%),
    radial-gradient(55% 45% at 50% 22%,rgba(209,59,52,.22),transparent 72%),
    var(--hero-img) 50% 35%/cover no-repeat,
    var(--bg)}
.ig-ring{width:176px;height:176px;border-radius:50%;padding:5px;margin:0 auto 18px;
  background:conic-gradient(var(--accent),#f1f3f5,var(--accent),#2a2e36,var(--accent));animation:ring 16s linear infinite}
.ig-ring img{width:100%;height:100%;border-radius:50%;border:5px solid var(--bg);display:block;object-fit:cover;animation:ring 16s linear infinite reverse}
@keyframes ring{to{transform:rotate(360deg)}}
.hero h1{margin:0 0 8px}
.hero .bio{max-width:34ch;margin:0 auto 14px;color:var(--muted);font-size:1.05rem}
.ig-meta{display:flex;justify-content:center;gap:8px 20px;flex-wrap:wrap;margin:0 0 22px;color:var(--muted);font-size:.92rem}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hl{display:flex;gap:22px;justify-content:center;margin-top:30px;overflow-x:auto;padding:4px 10px}
.hl a{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);font-size:.82rem;font-weight:600;min-width:72px}
.hl a:hover{text-decoration:none}
.hl i{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--accent-text);transition:border-color .15s}
.hl a:hover i{border-color:var(--accent)}
.hl svg{width:26px;height:26px}
/* celular: a foto aparece inteira como capa, e a logo sobrepõe a base dela */
@media (max-width:820px){
  .hero{padding-top:calc(56.25vw - 64px);
    background:
      linear-gradient(180deg,rgba(7,8,10,.18) 0%,rgba(7,8,10,0) 35%,var(--bg) 100%) top/100% 56.25vw no-repeat,
      var(--hero-img) top/100% auto no-repeat,
      var(--bg)}
}
@media (prefers-reduced-motion:reduce){.ig-ring,.ig-ring img{animation:none}*{scroll-behavior:auto!important}}
section.block{padding:46px 0;border-bottom:1px solid var(--line)}
.price{font-family:var(--font-display);font-size:1.7rem;color:var(--accent-text);line-height:1}
.quote{border-left:3px solid var(--accent);padding-left:14px}
footer.site{padding:34px 0 40px;color:var(--muted);font-size:.92rem}
footer.site .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}

/* booking */
.steps{display:flex;gap:6px;margin:6px 0 22px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface2)} .steps i.on{background:var(--accent)}
.cal{max-width:420px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid .dow{text-align:center;font-size:.75rem;color:var(--muted);padding:4px 0}
.cal-grid button{aspect-ratio:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.cal-grid button:disabled{opacity:.28;cursor:not-allowed;background:transparent;border-color:transparent}
.cal-grid button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal-grid button.today{border-color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.slots button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.slots button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:20px}
@media (min-width:821px){.sticky-cta{bottom:16px}}

/* agenda */
.tl{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tl-row{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid var(--line);min-height:46px}
.tl-row:last-child{border-bottom:0}
.tl-time{padding:12px 10px;color:var(--muted);font-size:.85rem;border-right:1px solid var(--line)}
.tl-body{padding:8px 12px;display:flex;align-items:center}
.tl-free .tl-body{color:var(--ok);font-size:.9rem}
.tl-off .tl-body,.tl-off .tl-time{background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.03) 8px 16px);color:var(--muted);font-size:.85rem}
.tl-lock .tl-body{background:rgba(229,96,95,.08);color:var(--danger);font-size:.9rem}
.tl-busy .tl-body{display:block;background:rgba(209,59,52,.13);border-left:4px solid var(--accent);padding:10px 12px}
.appt-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.weekcols{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.daycol h3{font-size:1rem;text-transform:capitalize}
.mini{border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface2);border-radius:8px;margin-bottom:8px;font-size:.88rem}
.mini.cancelled{opacity:.55;border-left-color:var(--danger);text-decoration:line-through}
.hours-row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.hours-row:last-child{border-bottom:0}
.hours-row .times{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hours-row input[type=time]{width:120px}
@media (max-width:560px){.hours-row{grid-template-columns:1fr}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
.modal.wide{max-width:640px}
.toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 16px;border-radius:12px;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{border-left-color:var(--danger)} .toast.ok{border-left-color:var(--ok)}
.loading{display:grid;place-items:center;padding:60px 0;color:var(--muted);gap:12px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{padding:12px 14px;border-radius:var(--r-md);background:rgba(226,165,66,.1);border:1px solid rgba(226,165,66,.35);font-size:.92rem;margin-bottom:14px}
.confirm-ok{width:64px;height:64px;border-radius:50%;background:rgba(69,183,132,.15);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.confirm-ok svg{width:34px;height:34px}
dl.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dl.sum dt{color:var(--muted)} dl.sum dd{margin:0;font-weight:600;text-align:right}
.avatar,.brand,.stat b,.price{font-weight:400}
.avatar{font-size:1.4rem}.avatar.lg{font-size:2rem}
.hours-list td:last-child{text-align:right;font-weight:700}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#/" id="brand"></a>
  <nav class="topnav" id="topnav" aria-label="Menu principal"></nav>
</div></header>
<main id="app"><div class="loading"><div class="spin"></div>Carregando…</div></main>
<nav class="bottomnav" id="bottomnav" aria-label="Menu"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>

const addDays = (iso,n) => { const d = new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

function toast(msg, type='') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').append(el); setTimeout(() => el.remove(), type === 'err' ? 6000 : 3500);
}
const errMsg = e => (e && (e.message || e.error_description)) || 'Algo deu errado. Tente novamente.';
const loading = (t='Carregando…') => `<div class="loading"><div class="spin"></div>${esc(t)}</div>`;

function modal(html, {wide=false, onMount}={}) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
    const close = v => { ov.remove(); document.removeEventListener('keydown', esc_); resolve(v); };
    const esc_ = e => { if (e.key === 'Escape') close(null); };
    ov.addEventListener('click', e => { if (e.target === ov) close(null); });
    ov.addEventListener('click', e => { const b = e.target.closest('[data-close]'); if (b) close(b.dataset.close === 'ok' ? true : false); });
    document.addEventListener('keydown', esc_);
    document.body.append(ov);
    ov._close = close;
    if (onMount) onMount(ov, close);
  });
}
const confirmBox = (title, text, ok='Confirmar', danger=false) => modal(`
  <h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>
  <div class="row" style="margin-top:18px"><button class="btn ghost" data-close="no">Voltar</button><button class="btn ${danger?'danger':'gold'}" data-close="ok">${esc(ok)}</button></div>`);

function formModal(title, fieldsHtml, onSubmit, {wide=false, submit='Salvar'}={}) {
  return modal(`<h3>${esc(title)}</h3><form novalidate>${fieldsHtml}<div class="row" style="margin-top:8px"><button type="button" class="btn ghost" data-close="no">Cancelar</button><button class="btn gold" type="submit">${esc(submit)}</button></div></form>`, {wide,
    onMount(ov, close) {
      const form = $('form', ov);
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const btn = $('[type=submit]', form); btn.disabled = true;
        try { const ok = await onSubmit(Object.fromEntries(new FormData(form)), form); if (ok !== false) close(true); }
        catch (err) { toast(errMsg(err), 'err'); }
        btn.disabled = false;
      });
    }});
}

const ROUTES = [];
const route = (re, roles, fn) => ROUTES.push({re, roles, fn});
async function router() {
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.roles) {
      if (!S.user) { S.next = '#' + raw; location.hash = '#/login'; return; }
      if (!r.roles.includes(role())) { toast('Você não tem acesso a essa área.', 'err'); location.hash = homeFor(); return; }
    }
    renderNav(); window.scrollTo(0, 0);
    $('#app').innerHTML = loading();
    try { await r.fn(m.slice(1), q); }
    catch (e) { console.error(e); $('#app').innerHTML = `<div class="page"><div class="wrap"><div class="empty">Não foi possível carregar esta página.<br><span class="small">${esc(errMsg(e))}</span></div></div></div>`; }
    return;
  }
  location.hash = '#/';
}

/* delegação global de eventos */
const ACT = {}, FORMS = {};
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a && !a.dataset.act && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.button) {
    e.preventDefault(); const h = a.getAttribute('href');
    if (location.hash === h) router(); else location.hash = h;
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = $('[type=submit]', f); if (btn) btn.disabled = true;
  try { await fn(Object.fromEntries(new FormData(f)), f); } catch (err) { toast(errMsg(err), 'err'); }
  if (btn && btn.isConnected) btn.disabled = false;
});

const B = () => S.book;
let SVC = [], BARB = [], WH = {}, slotCache = {}, BOOK_OFFLINE = false;
async function slotsFor(barberId, serviceId, date) {
  const key = barberId + serviceId + date;
  if (slotCache[key]) return slotCache[key];
  const {data, error} = await SB.rpc('get_available_slots', {p_barber_id:barberId, p_service_id:serviceId, p_date:date, p_interval_minutes:30});
  if (error) throw error;
  return (slotCache[key] = data || []);
}
async function slotsForChoice(date) {
  const b = B(); const ids = b.barberId === 'any' ? BARB.map(x => x.id) : [b.barberId];
  const res = await Promise.all(ids.map(async id => (await slotsFor(id, b.serviceId, date)).map(s => ({time:hm(s.start_time), end:hm(s.end_time), barber:id}))));
  const map = new Map();
  res.flat().forEach(s => { if (!map.has(s.time)) map.set(s.time, []); map.get(s.time).push(s.barber); });
  return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([time,bs]) => ({time, barbers:bs}));
}
route(/^\/agendar$/, null, async () => {
  const [{data:s, error:e1}, {data:b, error:e2}] = await Promise.all([SB.from('services').select('*').eq('active', true).order('price'), SB.from('barbers').select('*').eq('active', true).order('name')]);
  BOOK_OFFLINE = !!(e1 || e2) || (!s?.length && !b?.length);
  SVC = BOOK_OFFLINE ? SEED.services : (s || []); BARB = BOOK_OFFLINE ? SEED.barbers : (b || []);
  const ids = BARB.map(x => x.id);
  WH = {};
  if (BOOK_OFFLINE) ids.forEach(id => WH[id] = new Set([1,2,3,4,5,6]));
  else { const {data:wh} = ids.length ? await SB.from('barber_working_hours').select('barber_id,day_of_week').eq('active', true).in('barber_id', ids) : {data:[]};
    (wh||[]).forEach(r => (WH[r.barber_id] ||= new Set()).add(r.day_of_week)); }
  slotCache = {};
  drawBook();
});
function drawBook() {

function drawCal() {
  const b = B(); const today = todayISO();
  if (!b.cal) { const [y,m] = (b.date || today).split('-'); b.cal = {y:+y, m:+m}; }
  const {y,m} = b.cal, first = `${y}-${String(m).padStart(2,'0')}-01`;
  const start = dowOf(first), days = new Date(y, m, 0).getDate();
  const ids = b.barberId === 'any' ? BARB.map(x => x.id) : [b.barberId];
  const works = d => ids.some(id => WH[id]?.has(dowOf(d)));
  const monthName = new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  let cells = ['D','S','T','Q','Q','S','S'].map(x => `<div class="dow">${x}</div>`).join('') + '<span></span>'.repeat(start);
  for (let d = 1; d <= days; d++) {
    const iso = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const off = iso < today || !works(iso);
    cells += `<button data-act="bk-date" data-d="${iso}" ${off?'disabled':''} class="${iso===b.date?'sel':''} ${iso===today?'today':''}" aria-label="${esc(fmtDate(iso))}">${d}</button>`;
  }
  $('#cal').innerHTML = `<div class="cal-head"><button data-act="cal-prev" aria-label="Mês anterior">‹</button><b style="text-transform:capitalize">${esc(monthName)}</b><button data-act="cal-next" aria-label="Próximo mês">›</button></div><div class="cal-grid">${cells}</div>
    <p class="muted small" style="margin-top:10px">Dias sem horário de atendimento ficam desativados.</p>`;
  // desativa dias sem nenhum horário livre (folgas, bloqueios, lotados)
  const enabled = $$('#cal [data-act=bk-date]:not(:disabled)');
  let i = 0; const token = b.cal.t = Math.random();
  const worker = async () => { while (i < enabled.length && b.cal?.t === token) { const btn = enabled[i++]; try { const s = await slotsForChoice(btn.dataset.d); if (!s.length && btn.isConnected) btn.disabled = true; } catch (e) {} } };
  Promise.all([worker(), worker(), worker(), worker()]);
}
ACT['cal-prev'] = () => { const c = B().cal; c.m--; if (c.m < 1) { c.m = 12; c.y--; } drawCal(); };
ACT['cal-next'] = () => { const c = B().cal; c.m++; if (c.m > 12) { c.m = 1; c.y++; } drawCal(); };

async function drawSlots() {
  const b = B(); const box = $('#slots');

    const slots = await slotsForChoice(b.date);
    if (!slots.length) { box.innerHTML = `<div class="empty">Não há horários livres neste dia.<br><button class="btn sm" style="margin-top:12px" data-act="bk-back">Escolher outra data</button></div>`; return; }
    box.innerHTML = `<div class="slots">${slots.map(s => `<button data-act="bk-slot" data-t="${s.time}" data-b="${s.barbers[Math.floor(Math.random()*s.barbers.length)]}" class="${b.time===s.time?'sel':''}">${s.time}</button>`).join('')}</div>`;
  } catch (e) { box.innerHTML = `<div class="empty">Não foi possível carregar os horários.<br><span class="small">${esc(errMsg(e))}</span></div>`; }
}

const APPT_FULL = '*, services(name,price,duration_minutes), barbers(name), profiles!appointments_customer_id_fkey(name,phone,email)';
async function loadDay(barberId, date) {
  const d = dowOf(date);
  const [wh, br, bl, ap] = await Promise.all([
    SB.from('barber_working_hours').select('*').eq('barber_id', barberId).eq('day_of_week', d).eq('active', true),
    SB.from('barber_breaks').select('*').eq('barber_id', barberId).eq('day_of_week', d).eq('active', true),
    SB.from('blocked_times').select('*').eq('barber_id', barberId).eq('date', date),
    SB.from('appointments').select(APPT_FULL).eq('barber_id', barberId).eq('appointment_date', date).order('start_time')
  ]);
  for (const r of [wh, br, bl, ap]) if (r.error) throw r.error;
  return {date, wh:wh.data, br:br.data, bl:bl.data, ap:ap.data};
}
function dayModel(m) {
  const live = m.ap.filter(a => a.status !== 'cancelled');
  const wins = m.wh.map(w => [toMin(w.start_time), toMin(w.end_time)]);
  let lo = wins.length ? Math.min(...wins.map(w => w[0])) : 8*60, hi = wins.length ? Math.max(...wins.map(w => w[1])) : 18*60;
  live.forEach(a => { lo = Math.min(lo, toMin(a.start_time)); hi = Math.max(hi, toMin(a.end_time)); });
  lo = Math.floor(lo/30)*30;
  const rows = []; let free = 0, busy = 0; const isToday = m.date === todayISO(), now = nowMin();
  for (let t = lo; t < hi; t += 30) {
    const ap = live.find(a => toMin(a.start_time) < t+30 && toMin(a.end_time) > t);
    if (ap) { if (toMin(ap.start_time) >= t || t === lo) { rows.push({t, type:'busy', ap}); } else rows.push({t, type:'cover'}); busy++; continue; }
    const inWork = wins.some(w => t >= w[0] && t+30 <= w[1]);
    const brk = m.br.find(b => t < toMin(b.end_time) && t+30 > toMin(b.start_time));
    const blk = m.bl.find(b => t < toMin(b.end_time) && t+30 > toMin(b.start_time));
    if (blk) rows.push({t, type:'lock', label:'Bloqueado' + (blk.reason ? ' · ' + blk.reason : ''), block:blk});
    else if (!inWork) rows.push({t, type:'off', label:'Fora do expediente'});
    else if (brk) rows.push({t, type:'lock', label:'Intervalo'});
    else { rows.push({t, type:'free'}); if (!isToday || t + 30 > now) free++; }
  }
  return {rows, live, free, busy, cancelled:m.ap.filter(a => a.status === 'cancelled')};
}
function apptBlock(a, actions=true) {
  const c = a.profiles;
  const acts = actions ? `<div class="appt-actions">
    ${a.status === 'scheduled' ? `<button class="btn sm" data-act="st" data-st="confirmed" data-id="${a.id}">Confirmar</button>` : ''}
    ${isActive(a.status) ? `<button class="btn sm" data-act="st" data-st="completed" data-id="${a.id}">Concluir</button><button class="btn sm" data-act="st" data-st="no_show" data-id="${a.id}">Ausente</button><button class="btn danger sm" data-act="st-cancel" data-id="${a.id}">Cancelar</button>` : ''}</div>` : '';
  return `<div class="flex between top wrap"><div><b>${hm(a.start_time)}–${hm(a.end_time)} · ${esc(c?.name||'Cliente')}</b><div class="small muted">${esc(a.services?.name||'')} · ${a.services?.duration_minutes||''} min${a.notes ? ' · “' + esc(a.notes) + '”' : ''}</div>
    ${c?.phone ? `<div class="small"><a href="tel:${esc(digits(c.phone))}">${esc(c.phone)}</a> · <a href="${esc(waLink(c.phone))}" target="_blank" rel="noopener">WhatsApp</a></div>` : ''}</div>${pill(a.status)}</div>${acts}`;
}
function timelineHtml(model, {actions=true, showBarber=false}={}) {
  const rows = model.rows.filter(r => r.type !== 'cover').map(r => {
    const time = `<div class="tl-time">${fromMin(r.t)}</div>`;
    if (r.type === 'busy') return `<div class="tl-row tl-busy">${time}<div class="tl-body">${'<div style="width:100%">' + apptBlock(r.ap, actions) + '</div>'}</div></div>`;
    if (r.type === 'free') return `<div class="tl-row tl-free">${time}<div class="tl-body">Livre</div></div>`;
    if (r.type === 'lock') return `<div class="tl-row tl-lock">${time}<div class="tl-body">${esc(r.label)}${r.block && actions ? `<span class="spacer"></span><button class="btn sm ghost" data-act="del-block" data-id="${r.block.id}">Remover</button>` : ''}</div></div>`;
    return `<div class="tl-row tl-off">${time}<div class="tl-body">${esc(r.label)}</div></div>`;
  }).join('');
  const canc = model.cancelled.length ? `<p class="small muted" style="margin:10px 4px 0">Cancelados: ${model.cancelled.map(a => `${hm(a.start_time)} ${esc(a.profiles?.name||'')}`).join(' · ')}</p>` : '';
  return `<div class="tl">${rows || '<div class="empty" style="border:0">Sem expediente neste dia.</div>'}</div>${canc}`;
}

async function drawHours(barberId, name) {
  const [w, b] = await Promise.all([SB.from('barber_working_hours').select('*').eq('barber_id', barberId), SB.from('barber_breaks').select('*').eq('barber_id', barberId)]);
  if (w.error) throw w.error; if (b.error) throw b.error;
  const multi = [0,1,2,3,4,5,6].some(d => w.data.filter(x => x.day_of_week === d).length > 1 || b.data.filter(x => x.day_of_week === d).length > 1);
  const order = [1,2,3,4,5,6,0];
  const rows = order.map(d => {
    const wr = w.data.find(x => x.day_of_week === d && x.active) || w.data.find(x => x.day_of_week === d), br = b.data.find(x => x.day_of_week === d && x.active);
    const on = !!(wr && wr.active);
    return `<div class="hours-row" data-day="${d}"><label class="check"><input type="checkbox" name="on" ${on?'checked':''}><b>${DAYS[d]}</b></label>
      <div><div class="times"><input type="time" name="start" value="${hm(wr?.start_time||'08:00')}"> <span class="muted">às</span> <input type="time" name="end" value="${hm(wr?.end_time||'18:00')}"></div>

      <input type="time" name="bstart" value="${hm(br?.start_time||'12:00')}"> <span class="muted">às</span> <input type="time" name="bend" value="${hm(br?.end_time||'13:00')}"></div></div></div>`; }).join('');
  page('Horário de trabalho' + (name ? ' · ' + esc(name) : ''), `${multi ? '<div class="notice">Há dias com mais de um período cadastrado. Ao salvar, cada dia passa a ter um único período e um intervalo.</div>' : ''}
    <p class="muted">As alterações valem para novos agendamentos. Agendamentos já marcados não são alterados. Desmarque um dia para folga.</p>
    <div class="card" id="hours" data-barber="${barberId}">${rows}</div>
    <button class="btn gold block sticky-cta" data-act="save-hours">Salvar horários</button>`);
}
ACT['save-hours'] = async el => {
  const box = $('#hours'), barberId = box.dataset.barber, wRows = [], bRows = [];
  for (const r of $$('.hours-row', box)) {
    const d = +r.dataset.day, g = n => $(`[name=${n}]`, r), on = g('on').checked; if (!on) continue;
    const s = g('start').value, e = g('end').value;
    if (!s || !e || s >= e) return toast(`${DAYS[d]}: o horário final precisa ser depois do inicial.`, 'err');
    wRows.push({barber_id:barberId, day_of_week:d, start_time:s, end_time:e, active:true});

      if (!bs || !be || bs >= be || bs < s || be > e) return toast(`${DAYS[d]}: o intervalo precisa estar dentro do expediente.`, 'err');
      bRows.push({barber_id:barberId, day_of_week:d, start_time:bs, end_time:be, active:true}); }

  el.disabled = false;
};

    <input type="date" value="${date}" style="width:auto;min-height:38px" onchange="location.hash='${url({d:'__'})}'.replace('__',this.value)"><a class="btn sm" href="${url({d:addDays(date,step)})}">›</a><a class="btn sm ghost" href="${url({d:todayISO()})}">Hoje</a>
    <select style="width:auto;min-height:38px" onchange="location.hash='${url({b:'__'})}'.replace('__',this.value)"><option value="">Todos os barbeiros</option>${bars.map(b => `<option value="${b.id}" ${b.id===bid?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
    <select style="width:auto;min-height:38px" onchange="location.hash='${url({s:'__'})}'.replace('__',this.value)"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${k===st?'selected':''}>${v}</option>`).join('')}</select>
    <span class="spacer"></span><div class="tabs" style="margin:0"><button class="${mode==='dia'?'on':''}" onclick="location.hash='${url({v:'dia'})}'">Dia</button><button class="${mode==='semana'?'on':''}" onclick="location.hash='${url({v:'semana'})}'">Semana</button></div></div>`;
  const sel = bars.filter(b => !bid || b.id === bid);
  if (mode === 'dia' && !st) {
    const models = await Promise.all(sel.filter(b => b.active || bid).map(async b => ({b, m:dayModel(await loadDay(b.id, date))})));
    page('Agenda geral', head + `<h2 style="text-transform:capitalize">${esc(fmtDate(date))}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${models.map(({b,m}) => `<div><h3>${esc(b.name)} <span class="muted small">· ${m.live.length} agend. · ${m.free} livres</span></h3>${timelineHtml(m)}</div>`).join('') || '<div class="empty">Nenhum barbeiro.</div>'}</div>`);
    return;
  }
  const from = mode === 'dia' ? date : weekStart(date), to = mode === 'dia' ? date : addDays(from, 6);
  let qy = SB.from('appointments').select(APPT_FULL).gte('appointment_date', from).lte('appointment_date', to).order('appointment_date').order('start_time');
  if (bid) qy = qy.eq('barber_id', bid); if (st) qy = qy.eq('status', st);
  const [{data, error}, bl] = await Promise.all([qy, (() => { let b = SB.from('blocked_times').select('*, barbers(name)').gte('date', from).lte('date', to).order('date'); if (bid) b = b.eq('barber_id', bid); return b; })()]);
  if (error) throw error;
  const days = Array.from({length: mode === 'dia' ? 1 : 7}, (_, i) => addDays(from, i));
  page('Agenda geral', head + `<div class="weekcols">${days.map(d => { const l = (data||[]).filter(a => a.appointment_date === d), k = st ? [] : (bl.data||[]).filter(x => x.date === d);
    return `<div class="card daycol"><h3>${esc(fmtShort(d))}</h3>${l.map(a => `<div class="mini ${a.status==='cancelled'?'cancelled':''}"><b>${hm(a.start_time)}</b> ${esc(a.profiles?.name||'')}<br><span class="muted">${esc(a.barbers?.name||'')} · ${esc(a.services?.name||'')} · ${STATUS[a.status]}</span></div>`).join('')}
      ${k.map(x => `<div class="mini" style="border-left-color:var(--danger)"><b>${hm(x.start_time)}</b> Bloqueio · ${esc(x.barbers?.name||'')}<br><span class="muted">${esc(x.reason||'')}</span></div>`).join('')}
      ${!l.length && !k.length ? '<span class="muted small">Nada por aqui</span>' : ''}</div>`; }).join('')}</div>`);
});

route(/^\/admin\/agendamentos$/, ['admin'], async (_, q) => {
  const bars = await barberOptions(); const isD = v => /^\d{4}-\d{2}-\d{2}$/.test(v||''); const from = isD(q.from) ? q.from : addDays(todayISO(), -7), to = isD(q.to) ? q.to : addDays(todayISO(), 30);
  q = {b:/^[0-9a-f-]{36}$/i.test(q.b||'') ? q.b : '', s:STATUS[q.s] ? q.s : ''};
  let qy = SB.from('appointments').select(APPT_FULL).gte('appointment_date', from).lte('appointment_date', to).order('appointment_date', {ascending:false}).order('start_time', {ascending:false}).limit(300);
  if (q.b) qy = qy.eq('barber_id', q.b); if (q.s) qy = qy.eq('status', q.s);
  const {data, error} = await qy; if (error) throw error;
  page('Agendamentos', `<form class="row card" style="margin-bottom:16px;align-items:flex-end" onsubmit="event.preventDefault();const f=new FormData(this);location.hash='#/admin/agendamentos?from='+f.get('from')+'&to='+f.get('to')+'&b='+f.get('b')+'&s='+f.get('s')">
    <label class="field" style="margin:0"><span>De</span><input type="date" name="from" value="${from}"></label><label class="field" style="margin:0"><span>Até</span><input type="date" name="to" value="${to}"></label>
    <label class="field" style="margin:0"><span>Barbeiro</span><select name="b"><option value="">Todos</option>${bars.map(b => `<option value="${b.id}" ${b.id===q.b?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>
    <label class="field" style="margin:0"><span>Status</span><select name="s"><option value="">Todos</option>${Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${k===q.s?'selected':''}>${v}</option>`).join('')}</select></label>
    <button class="btn gold" type="submit">Filtrar</button></form>
    ${data.length ? `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th></th></tr></thead><tbody>${data.map(a => `<tr>
      <td>${esc(fmtShort(a.appointment_date))}<br><span class="muted small">${hm(a.start_time)}–${hm(a.end_time)}</span></td><td>${esc(a.profiles?.name||'')}<br><span class="muted small">${esc(a.profiles?.phone||'')}</span></td>
      <td>${esc(a.services?.name||'')}<br><span class="muted small">${brl(a.services?.price)}</span></td><td>${esc(a.barbers?.name||'')}</td><td>${pill(a.status)}</td>
      <td class="right">${isActive(a.status) ? `<div class="appt-actions" style="justify-content:flex-end">${a.status==='scheduled'?`<button class="btn sm" data-act="st" data-st="confirmed" data-id="${a.id}">Confirmar</button>`:''}<button class="btn sm" data-act="st" data-st="completed" data-id="${a.id}">Concluir</button><button class="btn sm" data-act="st" data-st="no_show" data-id="${a.id}">Ausente</button><button class="btn danger sm" data-act="st-cancel" data-id="${a.id}">Cancelar</button></div>` : ''}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nenhum agendamento neste filtro.</div>`}
    ${data.length === 300 ? '<p class="muted small">Mostrando os 300 mais recentes. Refine o filtro para ver outros.</p>' : ''}`);
});

route(/^\/admin\/clientes$/, ['admin'], async (_, q) => {
  page('Clientes', `<input id="csearch" type="search" placeholder="Buscar por nome, telefone ou e-mail" value="${esc(q.q||'')}" style="margin-bottom:16px"><div id="clist">${loading()}</div>`);
  const run = async () => {
    const term = ($('#csearch').value || '').replace(/[%,()]/g, ' ').trim();
    let qy = SB.from('profiles').select('*').eq('role', 'customer').order('created_at', {ascending:false}).limit(100);
    if (term) qy = qy.or(`name.ilike.%${term}%,phone.ilike.%${term}%,email.ilike.%${term}%`);
    const {data, error} = await qy; if (!$('#clist')) return;
    $('#clist').innerHTML = error ? `<div class="empty">${esc(errMsg(error))}</div>` : data.length ? `<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Cadastro</th><th></th></tr></thead><tbody>${data.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${esc(c.email||'')}</td><td>${new Date(c.created_at).toLocaleDateString('pt-BR',{timeZone:TZ})}</td><td class="right"><button class="btn sm" data-act="client-hist" data-id="${c.id}" data-name="${esc(c.name)}">Histórico</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nenhum cliente encontrado.</div>`;
  };
  let t; $('#csearch').addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 300); }); run();
});
ACT['client-hist'] = async el => {
  const {data, error} = await SB.from('appointments').select(APPT_SEL).eq('customer_id', el.dataset.id).order('appointment_date', {ascending:false}).order('start_time', {ascending:false});
  if (error) return toast(errMsg(error), 'err');
  modal(`<h3>${esc(el.dataset.name)}</h3><p class="muted small">${data.length} agendamento(s)</p>${data.length ? `<div class="stack">${data.map(a => `<div class="card" style="padding:12px"><div class="flex between wrap"><b>${esc(fmtShort(a.appointment_date))} · ${hm(a.start_time)}</b>${pill(a.status)}</div><span class="muted small">${esc(a.services?.name||'')} com ${esc(a.barbers?.name||'')} · ${brl(a.services?.price)}</span></div>`).join('')}</div>` : '<div class="empty">Sem histórico.</div>'}<button class="btn block" style="margin-top:16px" data-close="no">Fechar</button>`, {wide:true});
};

/* --- barbeiros --- */
route(/^\/admin\/barbeiros$/, ['admin'], async () => {
  const {data, error} = await SB.from('barbers').select('*').order('name'); if (error) throw error;
  page('Barbeiros', `<div class="grid">${data.map(b => `<div class="card"><div class="flex">${avatar(b.photo_url, b.name)}<div><h3 style="margin:0">${esc(b.name)}</h3><span class="pill ${b.active?'confirmed':'cancelled'}">${b.active?'Ativo':'Desativado'}</span></div></div>
    <p class="muted small" style="margin:12px 0">${esc(b.description||'')}</p>
    <div class="appt-actions"><button class="btn sm" data-act="edit-barber" data-id="${b.id}">Editar</button><a class="btn sm" href="#/admin/barbeiro/${b.id}/horarios">Horário</a><a class="btn sm" href="#/admin/barbeiro/${b.id}/agenda">Agenda</a>
    <button class="btn sm ${b.active?'danger':''}" data-act="toggle-barber" data-id="${b.id}" data-active="${b.active}">${b.active?'Desativar':'Reativar'}</button></div></div>`).join('')}</div>`,
    `<button class="btn gold" data-act="new-barber">+ Adicionar barbeiro</button>`);
  S._barbers = data;
});
route(/^\/admin\/barbeiro\/([\w-]+)\/horarios$/, ['admin'], async ([id]) => { const {data} = await SB.from('barbers').select('name').eq('id', id).maybeSingle(); await drawHours(id, data?.name); });
route(/^\/admin\/barbeiro\/([\w-]+)\/agenda$/, ['admin'], async ([id], q) => drawAgenda(id, q, `#/admin/barbeiro/${id}/agenda`));
const barberFields = b => `<label class="field"><span>Nome de exibição</span><input name="name" value="${esc(b?.name||'')}" required></label>
  <label class="field"><span>Descrição / especialidade</span><textarea name="description">${esc(b?.description||'')}</textarea></label>
  <label class="field"><span>Link da foto</span><input name="photo_url" type="url" value="${esc(b?.photo_url||'')}" placeholder="https://…"></label>`;
ACT['new-barber'] = () => formModal('Adicionar barbeiro', `<div class="notice">A pessoa precisa ter uma conta criada pelo cadastro do site. Informe o e-mail dela para liberar o acesso de barbeiro.</div>
  <label class="field"><span>E-mail da conta</span><input name="email" type="email" required></label>${barberFields()}`, async f => {
  const email = f.email.trim().toLowerCase(); if (!email || !f.name.trim()) { toast('Informe e-mail e nome.', 'err'); return false; }
  const {data:p} = await SB.from('profiles').select('id,role').ilike('email', email.replace(/[_%\\]/g, m => '\\' + m)).maybeSingle();
  if (!p) { toast('Nenhuma conta com esse e-mail. Peça para a pessoa se cadastrar primeiro.', 'err'); return false; }
  if (p.role === 'admin') { toast('Esta conta é de administrador.', 'err'); return false; }
  const {data:ex} = await SB.from('barbers').select('id').eq('profile_id', p.id).maybeSingle();
  if (ex) { toast('Esta pessoa já é barbeiro.', 'err'); return false; }
  let r = await SB.from('profiles').update({role:'barber'}).eq('id', p.id); if (r.error) throw r.error;
  const ins = await SB.from('barbers').insert({profile_id:p.id, name:f.name.trim(), description:f.description.trim() || null, photo_url:f.photo_url.trim() || null, active:true}).select().single(); if (ins.error) throw ins.error;
  const hrs = [1,2,3,4,5].map(d => ({barber_id:ins.data.id, day_of_week:d, start_time:'08:00', end_time:'18:00', active:true})).concat([{barber_id:ins.data.id, day_of_week:6, start_time:'08:00', end_time:'14:00', active:true}]);
  await SB.from('barber_working_hours').insert(hrs);
  toast('Barbeiro adicionado com horário padrão. Ajuste em “Horário”.', 'ok'); router();
});
ACT['edit-barber'] = el => { const b = S._barbers.find(x => x.id === el.dataset.id);
  formModal('Editar barbeiro', barberFields(b), async f => {
    const {error} = await SB.from('barbers').update({name:f.name.trim(), description:f.description.trim() || null, photo_url:f.photo_url.trim() || null}).eq('id', b.id);
    if (error) throw error; toast('Barbeiro atualizado.', 'ok'); router(); }); };
ACT['toggle-barber'] = async el => {
  const on = el.dataset.active === 'true';
  if (on && !await confirmBox('Desativar barbeiro?', 'Ele deixa de aparecer para novos agendamentos. O histórico é mantido.', 'Desativar', true)) return;
  const {error} = await SB.from('barbers').update({active:!on}).eq('id', el.dataset.id);
  if (error) return toast(errMsg(error), 'err'); toast(on ? 'Barbeiro desativado.' : 'Barbeiro reativado.', 'ok'); router();
};

/* --- serviços --- */
route(/^\/admin\/servicos$/, ['admin'], async () => {
  const {data, error} = await SB.from('services').select('*').order('name'); if (error) throw error; S._services = data;
  page('Serviços', data.length ? `<div class="grid">${data.map(s => `<div class="card"><div class="flex between top"><h3>${esc(s.name)}</h3><span class="price">${brl(s.price)}</span></div>
    <p class="muted small">${esc(s.description||'')}</p><div class="flex wrap"><span class="pill">${s.duration_minutes} min</span><span class="pill ${s.active?'confirmed':'cancelled'}">${s.active?'Ativo':'Desativado'}</span></div>
    <div class="appt-actions" style="margin-top:12px"><button class="btn sm" data-act="edit-service" data-id="${s.id}">Editar</button><button class="btn sm" data-act="toggle-service" data-id="${s.id}" data-active="${s.active}">${s.active?'Desativar':'Reativar'}</button><button class="btn danger sm" data-act="del-service" data-id="${s.id}">Excluir</button></div></div>`).join('')}</div>` : `<div class="empty">Nenhum serviço cadastrado.</div>`,
    `<button class="btn gold" data-act="new-service">+ Novo serviço</button>`);
});
const serviceFields = s => `<label class="field"><span>Nome</span><input name="name" value="${esc(s?.name||'')}" required></label>
  <label class="field"><span>Descrição</span><textarea name="description">${esc(s?.description||'')}</textarea></label>
  <div class="row"><label class="field"><span>Preço (R$)</span><input name="price" inputmode="decimal" value="${s ? Number(s.price).toFixed(2).replace('.',',') : ''}" required></label>
  <label class="field"><span>Duração (minutos)</span><input name="duration" type="number" min="5" max="480" step="5" value="${s?.duration_minutes||30}" required></label></div>`;
const parseService = f => { const price = parseFloat(String(f.price).replace(/\./g, '').replace(',', '.')), dur = parseInt(f.duration, 10);
  if (!f.name.trim()) throw new Error('Informe o nome do serviço.'); if (!(price >= 0)) throw new Error('Informe um preço válido.'); if (!(dur >= 5 && dur <= 480)) throw new Error('A duração deve ficar entre 5 e 480 minutos.');
  return {name:f.name.trim(), description:f.description.trim() || null, price, duration_minutes:dur}; };
ACT['new-service'] = () => formModal('Novo serviço', serviceFields(), async f => { const {error} = await SB.from('services').insert({...parseService(f), active:true}); if (error) throw error; toast('Serviço criado.', 'ok'); router(); });
ACT['edit-service'] = el => { const s = S._services.find(x => x.id === el.dataset.id);
  formModal('Editar serviço', serviceFields(s), async f => { const {error} = await SB.from('services').update(parseService(f)).eq('id', s.id); if (error) throw error; toast('Serviço atualizado. Novos agendamentos usam o novo preço e duração.', 'ok'); router(); }); };
ACT['toggle-service'] = async el => { const on = el.dataset.active === 'true'; const {error} = await SB.from('services').update({active:!on}).eq('id', el.dataset.id); if (error) return toast(errMsg(error), 'err'); toast(on ? 'Serviço desativado.' : 'Serviço reativado.', 'ok'); router(); };
ACT['del-service'] = async el => {
  if (!await confirmBox('Excluir serviço?', 'Só é possível excluir serviços sem agendamentos. Caso contrário, desative.', 'Excluir', true)) return;
  const {error} = await SB.from('services').delete().eq('id', el.dataset.id);
  if (error) return toast(/foreign|violates/i.test(error.message) ? 'Este serviço tem agendamentos. Desative-o em vez de excluir.' : errMsg(error), 'err');
  toast('Serviço excluído.', 'ok'); router();
};

/* --- configurações --- */
route(/^\/admin\/config$/, ['admin'], async () => {
  await loadSettings();
  page('Configurações', `<div class="card" style="max-width:520px"><form data-form="settings" novalidate>
    <label class="field"><span>Intervalo entre clientes (minutos)</span><input name="buffer" type="number" min="0" max="120" step="5" value="${S.settings.buffer_minutes}"></label>
    <p class="muted small" style="margin-top:-6px">Ex.: com 10 min, um serviço que termina às 14:30 libera o próximo horário às 14:40.</p>
    <label class="field"><span>Cancelamento pelo cliente até (horas antes)</span><input name="hours" type="number" min="0" max="72" value="${S.settings.cancel_min_hours}"></label>
    <p class="muted small">Fuso horário do sistema: America/Sao_Paulo (Brasília).</p>
    <button class="btn gold block" type="submit">Salvar configurações</button></form></div>
    <div class="card" style="max-width:520px;margin-top:18px"><h3>Minha conta</h3><p class="muted small">Você está logado como ${esc(S.user.email)}.</p><form data-form="reset" novalidate><label class="field"><span>Nova senha (mínimo 6 caracteres)</span><input name="password" type="password" minlength="6" autocomplete="new-password"></label><button class="btn block" type="submit">Alterar senha</button></form>
    <button class="btn danger block" style="margin-top:12px" data-act="logout">Sair da conta</button></div>`);
});
FORMS.settings = async f => {
  const buffer = parseInt(f.buffer, 10), hours = parseInt(f.hours, 10);
  if (!(buffer >= 0 && buffer <= 120) || !(hours >= 0)) return toast('Confira os valores informados.', 'err');
  const {error} = await SB.from('shop_settings').update({buffer_minutes:buffer, cancel_min_hours:hours}).eq('id', true);
  if (error) return toast(errMsg(error), 'err'); await loadSettings(); toast('Configurações salvas.', 'ok');
};

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('hashchange', router);
(async () => {
  try { await Promise.all([loadUser(), loadSettings()]); } catch (e) { console.error(e); }
  SB.auth.onAuthStateChange(async ev => { if (ev === 'SIGNED_OUT') { S.user = S.profile = S.barber = null; renderNav(); } });
  router();
})();
</script>
</body>
</html>
